[project]
name = "paw-health-api"
version = "0.1.0"
description = "Professional Veterinary Management System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlmodel>=0.0.16",
    "pyjwt>=2.8.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.6",
    "redis[asyncio]>=8.0.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
]
